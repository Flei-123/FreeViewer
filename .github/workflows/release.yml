name: Release

# Laeuft bei einem v*-Tag: baut Linux, macOS und Windows und haengt die
# Archive an das GitHub-Release. Ohne eingemottete actions-rs-Aktionen.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-24.04   # libspa 0.10 braucht PipeWire >= 0.3.65, 22.04 hat 0.3.48
            target: x86_64-unknown-linux-gnu
            archive: freeviewer-linux-x86_64.tar.gz
          - build: macos
            os: macos-14
            target: aarch64-apple-darwin
            archive: freeviewer-macos-arm64.tar.gz
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: freeviewer-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: System packages (Linux)
        if: matrix.build == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxdo-dev libxi-dev libgtk-3-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxkbcommon-dev libgbm-dev libdrm-dev pkg-config cmake nasm autoconf automake libtool
      - name: Autotools for audiopus_sys (macOS)
        if: matrix.build == 'macos'
        run: brew install autoconf automake libtool
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Archive
        shell: bash
        run: |
          mkdir archive && cp LICENSE README.md archive/
          if [ "${{ matrix.build }}" = "windows" ]; then
            cp target/${{ matrix.target }}/release/freeviewer.exe archive/
            (cd archive && 7z a ../${{ matrix.archive }} *)
          else
            strip target/${{ matrix.target }}/release/freeviewer || true
            cp target/${{ matrix.target }}/release/freeviewer archive/
            tar czf ${{ matrix.archive }} -C archive .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

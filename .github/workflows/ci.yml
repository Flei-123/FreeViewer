name: CI

# Runs on every push to main and on every pull request.
# Windows/Mac builds live in windows.yml / mac.yml.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcb1-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxdo-dev libxi-dev libgtk-3-dev libasound2-dev \
            libpipewire-0.3-dev libspa-0.2-dev libwayland-dev libxkbcommon-dev \
            libclang-dev cmake pkg-config

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Test (Cargo.lock is tracked, so --locked)
        run: cargo test --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Known vulnerabilities fail the job; "unmaintained"/"yanked" notes do not.
      - run: cargo audit

  relay:
    name: relay tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix relay --no-audit --no-fund
      - run: node relay/test_publish.js

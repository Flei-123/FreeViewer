# PROPOSAL (r13) - NOT applied. Include in the server{} block of meet./freeviewer./remote.fleitec.com
# (Nginx Proxy Manager: "Advanced" tab of the proxy host; NPM's own "HSTS enabled" switch does the first line).
# Test with:  curl -sI https://meet.fleitec.com | grep -i -E 'strict|content-security|x-content|referrer'

# HSTS: start with a short max-age, raise after a week without problems. Add includeSubDomains/preload
# ONLY when every *.fleitec.com host serves HTTPS (otherwise it locks you out of plain-http subdomains).
add_header Strict-Transport-Security "max-age=86400" always;
#  later:   "max-age=31536000; includeSubDomains"

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
add_header X-Frame-Options "DENY" always;

# ---- meet.fleitec.com (FreeMeet web app) ----
# Facts from web/index.html: scripts are local files only (/hintergrund.js, /e2e.js, /app.js), font local
# (/fonts/inter.woff2), favicon is a data: URI, there are style="" attributes -> style-src needs 'unsafe-inline'.
# The page talks WebSocket/HTTP to its own host and loads blob: video/audio -> connect-src 'self' wss://meet.fleitec.com.
# FIRST roll out as Report-Only, watch the browser console for violations, then rename the header.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' wss://meet.fleitec.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

# ---- freeviewer./remote.fleitec.com (download pages + relay) ----
# Only the relay JSON/downloads are served there, no scripts are known to be needed:
#   add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
# (if the root path serves an HTML landing page, test it before enabling)

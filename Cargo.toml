[package]
name = "freeviewer"
version = "0.26.9"
edition = "2021"
description = "Open-source remote desktop - free TeamViewer alternative (relay + end-to-end encryption)"
license = "GPL-3.0"
repository = "https://github.com/Flei-123/FreeViewer"
authors = ["Flei-123"]
readme = "README.md"
keywords = ["remote-desktop", "screen-sharing", "teamviewer", "vnc", "cross-platform"]
categories = ["network-programming", "multimedia"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# async + transport
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# gui
eframe = "0.33"
egui = "0.33"
egui_extras = { version = "0.33", features = ["svg"] }

# capture / input / codec
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
enigo = "0.6"
arboard = { version = "3", default-features = false }
rfd = "0.15"
ureq = "3"
cpal = "0.15"

# crypto (end-to-end, the relay never sees plaintext)
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
ed25519-dalek = { version = "2", optional = true }
# WebRTC-Kern fuer das native Meeting. Krypto bewusst als reines Rust
# (rust-crypto): so bauen Windows und Mac ohne cmake/NASM/OpenSSL.
str0m = { version = "0.21", default-features = false, features = ["rust-crypto"] }
audiopus = "0.2"   # Opus - wird als C-Quelle mitgebaut (Windows + Mac + Linux)
rustfft = "6"

# Kamera auf dem Mac (Stufe 5c). AVFoundation ist Objective-C - nokhwa
# kapselt das; unter Windows bleibt es beim eigenen Media-Foundation-Weg.
[target.'cfg(target_os="macos")'.dependencies]
nokhwa = { version = "0.10", features = ["input-avfoundation"] }

# DXGI Desktop Duplication capture + SendInput / low level hooks (Windows only)
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Shell",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Environment",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_Security",
]

# "start with Windows" writes a single value into the user's Run key
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
# Lizenz-Pruefung - NUR fuer Marken-Builds (X-Remote). Der normale
# FreeViewer-Build bleibt ohne dieses Merkmal komplett frei.
license = ["dep:ed25519-dalek"]

[profile.dev]
# Auf dem Server ist die Platte klein: Debug-Symbole fressen 5 GB.
debug = 0

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "freeviewer"
path = "src/main.rs"

# Schluessel-Werkzeug - wird nur gebaut, wenn das Lizenz-Merkmal an ist.
[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
required-features = ["license"]

[package]
name = "freeviewer"
version = "0.6.1"
edition = "2021"
description = "Open-source remote desktop - free TeamViewer alternative (relay + end-to-end encryption)"
license = "GPL-3.0"
repository = "https://github.com/Flei-123/FreeViewer"
authors = ["Flei-123"]
readme = "README.md"
keywords = ["remote-desktop", "screen-sharing", "teamviewer", "vnc", "cross-platform"]
categories = ["network-programming", "multimedia"]

[dependencies]
anyhow = "1"
serde_json = "1"
hex = "0.4"

# async + transport
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# gui
eframe = "0.33"
egui = "0.33"

# capture / input / codec
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
enigo = "0.6"
arboard = { version = "3", default-features = false }
rfd = "0.15"
ureq = "3"

# crypto (end-to-end, the relay never sees plaintext)
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"

# DXGI Desktop Duplication capture + SendInput / low level hooks (Windows only)
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
strip = true

[[bin]]
name = "freeviewer"
path = "src/main.rs"
